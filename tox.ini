[tox]
env_list = 
	py{312,313,314}-django61-payments{41}-{sqlite,postgres}
	py{312,313,314}-django{52,60}-payments{40}-{sqlite,postgres}
	py{310,311,312,313,314}-django{52}-payments{31}-{sqlite,postgres}
	py{314}-django{main}-payments{41}-{sqlite,postgres}
	lint

[gh-actions]
python =
    3.10: py310
    3.11: py311, lint
    3.12: py312
    3.13: py313
    3.14: py314

[gh-actions:env]


[testenv:lint]
description = Run several code linting/formatting tools
deps =
	flake8
	flake8-isort
	flake8-black
	mypy
	django-stubs
commands =
	flake8 django_payments_mollie
	mypy django_payments_mollie

[testenv]
description = Run the test suite using pytest
use_develop = true
extras = test
deps = 
    django52: django>=5.2,<5.3
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2
    djangomain: git+https://github.com/django/django.git@main#egg=Django
    payments31: django-payments>=3.1,<3.2
    payments40: django-payments>=4.0,<4.1
    payments41: django-payments>=4.1,<4.2
    postgres: psycopg

set_env:
    postgres: DATABASE_URL={env:DATABASE_URL:postgres://postgres:postgres@localhost/django_payments_mollie}

commands = pytest
